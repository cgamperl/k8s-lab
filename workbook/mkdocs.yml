site_name: Übungen
site_url: https://cgamperl.github.io/k8s-lab/workbook/
docs_dir: docs
hooks:
  - hooks.py
nav:
  - Start: index.md
  - Tag 1: tag1.md
  - Tag 2: tag2.md
  - Tag 3: tag3.md
  - Anhang: anhang-symptome.md
theme:
  name: material
  language: de
  features:
    - content.code.copy
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-4, name: Dunkles Design}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-7, name: Helles Design}
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
