name: workbook

on:
  push:
    branches: [main]
    paths: ["workbook/**", ".github/workflows/workbook.yaml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbook/package-lock.json
      - run: npm ci
        working-directory: workbook
      - run: npm run build
        working-directory: workbook
      # gh-pages also holds the Helm repository (index.yaml, *.tgz); only the
      # workbook/ folder is replaced.
      - name: Publish to gh-pages/workbook
        run: |
          git fetch -q origin gh-pages
          git worktree add -q --detach "$RUNNER_TEMP/pages" origin/gh-pages
          cd "$RUNNER_TEMP/pages"
          rm -rf workbook
          cp -r "$GITHUB_WORKSPACE/workbook/docs/.vitepress/dist" workbook
          git add -A workbook
          if git diff --cached --quiet; then echo "workbook unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs(workbook): publish ${GITHUB_SHA::7}"
          git push -q origin HEAD:gh-pages
